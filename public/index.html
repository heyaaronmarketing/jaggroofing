<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local. Reliable. Proven by Long Island Homeowners.</title>
<meta name="description" content="Get a quick free estimate">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Local. Reliable. Proven by Long Island Homeowners.">
<meta property="og:description" content="Get a quick free estimate">
<meta property="og:image" content="/jagg-logo.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/jagg-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page-bg:#13171a;
  --card-bg:#1a1e23;
  --ink:#fcfafa;
  --ink-dim:#e5e7eb;
  --field-bg:rgba(255,255,255,.09);
  --field-border:rgba(229,231,235,.2);
  --accent:#f63f0a;
  --grad:linear-gradient(45deg,#3498db,#9b50ba,#e74c3c);
  --glow:rgba(0,255,255,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page-bg);
  color:var(--ink);
  font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:40px 16px 80px;
}
.shell{width:100%;max-width:660px}

/* The form card — border-image gradient + cyan glow, matching the source form. */
.card{
  background:var(--card-bg);
  border:3px solid transparent;
  border-image:var(--grad) 1 / 1 / 0 stretch;
  border-radius:0;
  box-shadow:0 0 25px var(--glow);
  padding:16px 24px 24px;
}

.logo-wrap{text-align:center;padding:8px 0 4px}
.logo-wrap img{max-height:200px;max-width:100%;height:auto;display:inline-block}

h1.headline{
  font-size:26px;
  line-height:1.3;
  font-weight:600;
  text-align:center;
  color:var(--accent);
  margin:10px 0 0;
}

hr.divider{
  border:0;
  border-top:1px solid rgba(229,231,235,.18);
  margin:16px 0 4px;
}

.field{margin-top:18px}
.field > label.q,
.field > .q{
  display:block;
  font-size:15px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:7px;
  line-height:1.35;
}
.req{color:var(--ink);font-weight:600}

.sub{
  display:block;
  font-size:13px;
  font-weight:500;
  color:var(--ink);
  margin:0 0 5px;
}

input[type=text],
input[type=tel],
input[type=email],
select{
  width:100%;
  height:40px;
  background:var(--field-bg);
  border:1px solid var(--field-border);
  border-radius:4px;
  color:var(--ink-dim);
  font-family:inherit;
  font-size:17px;
  padding:8px 12px;
  outline:none;
  transition:border-color .12s ease, box-shadow .12s ease;
}
input::placeholder{color:rgba(229,231,235,.45)}
input:focus,select:focus{
  border-color:rgba(93,140,217,.9);
  box-shadow:0 0 0 1px rgba(93,140,217,.5);
}
select{
  appearance:none;
  -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23c9ced6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;
  background-position:right 10px center;
  padding-right:32px;
  cursor:pointer;
}
select option{background:#1a1e23;color:#e5e7eb}

/* Input with a leading icon (email, address) */
.with-icon{position:relative}
.with-icon .icon{
  position:absolute;
  left:12px;top:50%;
  transform:translateY(-50%);
  width:18px;height:18px;
  color:rgba(229,231,235,.55);
  pointer-events:none;
  display:flex;align-items:center;
}
.with-icon input{padding-left:38px}

/* Phone field: country selector glued to the left of the number input */
.phone{display:flex;align-items:stretch}
.phone .country{
  position:relative;
  display:flex;align-items:center;gap:4px;
  height:40px;
  padding:0 8px;
  background:var(--field-bg);
  border:1px solid var(--field-border);
  border-right:0;
  border-radius:4px 0 0 4px;
  cursor:pointer;
}
.phone .country .flag{font-size:17px;line-height:1}
.phone .country svg{width:14px;height:14px;color:rgba(229,231,235,.6)}
.phone .country select{
  position:absolute;inset:0;
  width:100%;height:100%;
  opacity:0;
  border:0;
  cursor:pointer;
}
.phone input{border-radius:0 4px 4px 0}

/* Address block */
.addr-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin-top:12px;
}
@media (max-width:560px){ .addr-grid{grid-template-columns:1fr} }

.suggest{
  position:absolute;
  left:0;right:0;top:calc(100% + 4px);
  background:#20252b;
  border:1px solid var(--field-border);
  border-radius:4px;
  z-index:30;
  max-height:220px;
  overflow:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.suggest[hidden]{display:none}
.suggest button{
  display:block;width:100%;text-align:left;
  background:none;border:0;
  color:var(--ink-dim);
  font-family:inherit;font-size:14px;
  padding:9px 12px;cursor:pointer;
}
.suggest button:hover,.suggest button[aria-selected=true]{background:rgba(255,255,255,.08)}

/* Choice grid — two columns, matching the source layout */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px 24px;
  margin-top:2px;
}
@media (max-width:560px){ .choices{grid-template-columns:1fr} }
.choice{
  display:flex;align-items:center;gap:9px;
  padding:5px 0;
  cursor:pointer;
  font-size:15px;
  color:var(--ink);
}
.choice input[type=radio]{
  appearance:none;-webkit-appearance:none;
  width:16px;height:16px;margin:0;flex:0 0 16px;
  border:1px solid rgba(229,231,235,.45);
  border-radius:50%;
  background:var(--field-bg);
  cursor:pointer;
  position:relative;
}
.choice input[type=radio]:checked{border-color:#5d8cd9}
.choice input[type=radio]:checked::after{
  content:"";position:absolute;inset:3px;
  border-radius:50%;background:#5d8cd9;
}
#otherWrap{margin-top:8px}
#otherWrap[hidden]{display:none}

.actions{display:flex;justify-content:center;margin-top:26px}
button.submit{
  background-color:#de7728;
  background-image:var(--grad);
  color:#fff;
  border:none;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,255,255,.5);
  font-family:inherit;
  font-size:18px;
  font-weight:500;
  line-height:1.15;
  padding:11px 24px;
  cursor:pointer;
  transition:transform .08s ease, opacity .15s ease;
}
button.submit:hover{transform:translateY(1px)}
button.submit:active{transform:translateY(2px)}
button.submit[disabled]{opacity:.65;cursor:progress}

.err{
  color:#ff8a73;
  font-size:13px;
  margin-top:6px;
  display:none;
}
.err.show{display:block}
.form-err{
  margin-top:16px;
  text-align:center;
  color:#ff8a73;
  font-size:14px;
  display:none;
}
.form-err.show{display:block}

/* Thank-you step */
#thanks[hidden]{display:none}
#thanks{text-align:center;padding:48px 16px 52px}
#thanks h2{font-size:30px;font-weight:600;color:var(--ink);margin:0 0 10px}
#thanks p{font-size:17px;color:var(--ink-dim);margin:0 0 28px}
a.website-btn{
  display:inline-block;
  background:#ee673d;
  color:#fff;
  text-decoration:none;
  border-radius:12px;
  font-size:18px;
  font-weight:500;
  padding:11px 24px;
  transition:transform .08s ease;
}
a.website-btn:hover{transform:translateY(1px)}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="shell">
  <div class="card">

    <!-- Step 1: the estimate form -->
    <form id="estimateForm" novalidate>
      <div class="logo-wrap">
        <img src="/jagg-logo.png" alt="JAGG Roofing, Siding, and Windows" width="1550" height="575">
      </div>

      <h1 class="headline">Get a quick free estimate</h1>

      <hr class="divider">

      <!-- Name -->
      <div class="field">
        <label class="q" for="name">What's your name? <span class="req">*</span></label>
        <input id="name" name="name" type="text" placeholder="Enter your name here" autocomplete="name" required>
        <div class="err" data-for="name">Please enter your name.</div>
      </div>

      <!-- Phone -->
      <div class="field">
        <label class="q" for="phone">Best phone number to contact you? <span class="req">*</span></label>
        <div class="phone">
          <div class="country">
            <span class="flag" id="flag">🇺🇸</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            <label class="sr-only" for="country">Country code</label>
            <select id="country" name="country"></select>
          </div>
          <input id="phone" name="phone" type="tel" placeholder="000 000-0000" autocomplete="tel" required>
        </div>
        <div class="err" data-for="phone">Please enter a valid phone number.</div>
      </div>

      <!-- Email -->
      <div class="field">
        <label class="q" for="email">Your email please?</label>
        <div class="with-icon">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          </span>
          <input id="email" name="email" type="email" placeholder="Your email here" autocomplete="email">
        </div>
        <div class="err" data-for="email">Please enter a valid email address.</div>
      </div>

      <!-- Address -->
      <div class="field">
        <span class="q">What's your home address? <span class="req">*</span></span>
        <label class="sub" for="street1">Address</label>
        <div class="with-icon" style="position:relative">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </span>
          <input id="street1" name="street1" type="text" autocomplete="address-line1" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest" required>
          <div class="suggest" id="suggest" role="listbox" hidden></div>
        </div>
        <div class="addr-grid">
          <div>
            <label class="sub" for="city">City</label>
            <input id="city" name="city" type="text" autocomplete="address-level2" required>
          </div>
          <div>
            <label class="sub" for="state">State / Province</label>
            <select id="state" name="state" required><option value=""></option></select>
          </div>
          <div>
            <label class="sub" for="zip">ZIP / Postal code</label>
            <input id="zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" required>
          </div>
        </div>
        <div class="err" data-for="address">Please complete your home address.</div>
      </div>

      <!-- Services -->
      <div class="field">
        <span class="q">What services are you interested in?</span>
        <div class="choices" role="radiogroup" aria-label="What services are you interested in?">
          <label class="choice"><input type="radio" name="service" value="Roofing"><span>Roofing</span></label>
          <label class="choice"><input type="radio" name="service" value="Siding"><span>Siding</span></label>
          <label class="choice"><input type="radio" name="service" value="Windows"><span>Windows</span></label>
          <label class="choice"><input type="radio" name="service" value="__other__"><span>Other</span></label>
        </div>
        <div id="otherWrap" hidden>
          <label class="sr-only" for="serviceOther">Other service</label>
          <input id="serviceOther" name="serviceOther" type="text" placeholder="Tell us what you need">
        </div>
      </div>

      <div class="actions">
        <button class="submit" type="submit" id="submitBtn">Submit</button>
      </div>
      <div class="form-err" id="formErr"></div>
    </form>

    <!-- Step 2: thank you -->
    <div id="thanks" hidden>
      <h2 id="thanksTitle">Thank you!</h2>
      <p>We will reach out to you ASAP!</p>
      <a class="website-btn" href="https://jaggroofingsidingandwindows.com/" target="_blank" rel="noopener">Check Our Website Here</a>
    </div>

  </div>
</div>

<script src="/countries.js"></script>
<script src="/form.js"></script>
</body>
</html>
